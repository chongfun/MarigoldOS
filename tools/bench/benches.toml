# Warning budgets enforced by `bench.py report --strict` (and by `--strict`
# on capture commands, against the log just written). A non-strict report
# prints violations without failing. Budget parsing uses `tomllib`, which the
# repo's pinned interpreter (.python-version) always has.
#
# Sections and keys are validated against `BUDGET_SCHEMA` in bench.py before
# any capture is read: an unknown section, a misspelled key, a non-integer or
# negative value, an empty section, or an empty document is a load failure
# rather than something to skip past. A key that reads as enforced and is
# enforced by nothing is what this file exists to prevent, so adding a budget
# here means adding it there too.
#
# Shared defaults: these budgets apply to both boards (X4 and X3) by default.
# The page-turn ceilings accommodate the X4's slower panel (~421 ms Fast
# waveform, ~470 ms press-to-settled) while still catching gross regressions.
# For board-specific X3 / A12 regression gates (354 ms median turn, 307 ms Fast
# BUSY, 857 ms Full waveform), use `benches-x3.toml` (via `--board x3` or
# `--budgets tools/bench/benches-x3.toml`).

[page-turn]
# Shared page-turn median ceiling across both boards. Sized to accommodate
# the X4 (~421 ms Fast waveform, ~470 ms press-to-settled). For X3-specific
# regression gating (354 ms median post-A12), use benches-x3.toml (--board x3).
median_press_to_settled_ms = 550
# Floor for the same median: a genuine press-to-settled includes a full Fast
# refresh (306-383 ms busy measured on X3 after A12; ~421 ms on X4),
# so a median anywhere near or below this is presses paired against renders
# already in flight — operator burst cadence, not a faster device. Kept well
# under the real turn time so a legitimate optimization cannot trip it.
median_press_to_settled_min_ms = 250
# Shared Fast refresh BUSY ceiling across both boards. Sized to accommodate
# the X4 (~421 ms Fast waveform) while catching gross regressions on both
# panels. For X3 regression gating (307 ms Fast BUSY), see benches-x3.toml.
fast_refresh_busy_warn_ms = 500
reading_layout_warn_ms = 60
prestage_warn_ms = 40

[sleep-sync]
# Full refresh on the X3 is two BUSY intervals, not one: the driver runs
# the full waveform (857 ms measured on X3 after A12, previously 928 ms) and
# then a 307 ms clean pass (previously 379 ms), and both are logged as
# `refresh mode=Full`. The floor and ceiling bracket both intervals. On X4,
# a full refresh is a single ~3.5 s waveform. The 1100 ms ceiling here brackets
# the X3 two-pass sequence.
full_refresh_busy_min_ms = 300
full_refresh_busy_max_ms = 1100

[storage-cache]
# Warm book opens only: `storage_open` with `ram_hit=false` and no cache build
# in the same transaction — the path that loads an already-built cache,
# measured 57-95 ms here. Until 2026-07-31 this was computed over every
# `storage_open`, pooling three populations that do not overlap (RAM hits at
# 0-15 ms, cold builds at 14-64 *seconds*), so a cold open failed the warm
# ceiling and a RAM hit pulled the percentile back under it. Cold opens scale
# with book size; the report prints them per path and gates none.
# Re-sized 2026-09-10 from 150. The 57-95 ms population was measured on a
# flat card; on the foldered card the same open is 65-137 ms across four
# unattended captures on main 72b24f3 (n=21, median 87, p95 126), so 150 left
# 13 ms of margin for a gate meant to catch an O(n) regression. One 639 ms
# warm open was recorded on 2026-09-09 right after the walk descended the
# folder tree; it is filed as a roadmap finding, not sized into this budget.
warm_book_open_warn_ms = 200
catalog_load_warn_ms = 500
# section_extend_warn_ms was deleted 2026-07-30: no section-extend telemetry
# exists for it to gate (extends surface as `storage_open` with ram_hit), and
# a budget key that looks enforced but is read by nothing is worse than none.

[folder-nav]
# Entering and leaving a folder, each its own storage operation with its own
# telemetry. Sized from the first device capture of this suite, 2026-09-09,
# X3, an unattended bench-selftest walk of 20 round trips: entry 37-38 ms
# into a 6-row folder and 86-87 ms into a 14-row one, leave 38-40 ms
# throughout. The ceilings sit well above both so a legitimate change cannot
# trip them, and far below the 40 ms per-row cost an O(rows) regression
# would add on a large folder. Successful operations only: a refused leave
# is a card fault, gated by the suite check, not a slow sample.
folder_enter_warn_ms = 200
folder_leave_warn_ms = 150
